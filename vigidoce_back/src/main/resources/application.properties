spring.application.name=vigidocente

spring.datasource.url=jdbc:postgresql://localhost:5432/vigidocente
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
# ===== JWT =====
# IMPORTANTE: clave secreta de al menos 32 caracteres (256 bits) para HS256
app.jwt.secret=ESTA_ES_UNA_CLAVE_SUPER_SECRETA_PARA_JWT_VIGIDOCENTE_2026_CAMBIAR
# Duración del token en milisegundos (86400000 = 24 horas)
app.jwt.expiration=86400000