<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Docentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-person-badge me-2 text-primary"></i>Docentes</h2>
        <a href="/docentes/nuevo" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nuevo Docente</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Rol</th>
                    <th>Activo</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="docente : ${docentes}">
                    <td th:text="${docente.id}"></td>
                    <td th:text="${docente.nombre}"></td>
                    <td th:text="${docente.apellido}"></td>
                    <td th:text="${docente.email}"></td>
                    <td th:text="${docente.telefono}"></td>
                    <td><span class="badge bg-primary" th:text="${docente.rol}"></span></td>
                    <td>
                        <span th:if="${docente.activo}" class="badge bg-success">Sí</span>
                        <span th:unless="${docente.activo}" class="badge bg-danger">No</span>
                    </td>
                    <td>
                        <a th:href="@{/docentes/editar/{id}(id=${docente.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/docentes/eliminar/{id}(id=${docente.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
