<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Incidente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header border-0 py-3" style="background: linear-gradient(135deg, #1e3a5f, #2e86de);">
                    <h5 class="text-white mb-0 fw-bold"><i class="bi bi-exclamation-triangle me-2"></i>Formulario Incidente</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/incidentes/guardar}" th:object="${incidente}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Turno</label>
                            <select class="form-select" th:field="*{turno.id}">
                                <option th:each="t : ${turnos}" th:value="${t.id}"
                                        th:text="${t.id + ' - ' + t.docente.nombre + ' - ' + t.zona.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Zona</label>
                            <select class="form-select" th:field="*{zona.id}">
                                <option th:each="z : ${zonas}" th:value="${z.id}"
                                        th:text="${z.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo</label>
                            <select class="form-select" th:field="*{tipo}">
                                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Severidad</label>
                            <select class="form-select" th:field="*{severidad}">
                                <option th:each="s : ${severidades}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descripción</label>
                            <input type="text" class="form-control" th:field="*{descripcion}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha y Hora</label>
                            <input type="datetime-local" class="form-control" th:field="*{fechaHora}" required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Observación Estudiante</label>
                            <input type="text" class="form-control" th:field="*{observacionEstudiante}"/>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger flex-grow-1"><i class="bi bi-save me-1"></i>Guardar</button>
                            <a href="/incidentes" class="btn btn-outline-secondary flex-grow-1"><i class="bi bi-x me-1"></i>Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
