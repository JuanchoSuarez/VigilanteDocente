<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incidentes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-exclamation-triangle me-2 text-danger"></i>Incidentes</h2>
        <a href="/incidentes/nuevo" class="btn btn-danger"><i class="bi bi-plus-lg me-1"></i>Nuevo Incidente</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Turno</th>
                    <th>Zona</th>
                    <th>Tipo</th>
                    <th>Severidad</th>
                    <th>Descripción</th>
                    <th>Fecha y Hora</th>
                    <th>Observación</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="incidente : ${incidentes}">
                    <td th:text="${incidente.id}"></td>
                    <td th:text="${incidente.turno.id}"></td>
                    <td th:text="${incidente.zona.nombre}"></td>
                    <td><span class="badge bg-warning text-dark" th:text="${incidente.tipo}"></span></td>
                    <td>
                                <span th:classappend="${incidente.severidad.name() == 'S1_LEVE'} ? 'bg-success' :
                                                      (${incidente.severidad.name() == 'S2_SEGUIMIENTO'} ? 'bg-warning text-dark' : 'bg-danger')"
                                      class="badge" th:text="${incidente.severidad}"></span>
                    </td>
                    <td th:text="${incidente.descripcion}"></td>
                    <td th:text="${incidente.fechaHora}"></td>
                    <td th:text="${incidente.observacionEstudiante}"></td>
                    <td>
                        <a th:href="@{/incidentes/editar/{id}(id=${incidente.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/incidentes/eliminar/{id}(id=${incidente.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
