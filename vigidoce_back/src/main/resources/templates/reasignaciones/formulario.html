<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Reasignación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header border-0 py-3" style="background: linear-gradient(135deg, #1e3a5f, #2e86de);">
                    <h5 class="text-white mb-0 fw-bold"><i class="bi bi-arrow-left-right me-2"></i>Formulario Reasignación</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/reasignaciones/guardar}" th:object="${reasignacion}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Turno</label>
                            <select class="form-select" th:field="*{turno.id}">
                                <option th:each="t : ${turnos}" th:value="${t.id}"
                                        th:text="${t.id + ' - ' + t.docente.nombre + ' - ' + t.zona.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Docente Original</label>
                            <select class="form-select" th:field="*{docenteOriginal.id}">
                                <option th:each="d : ${docentes}" th:value="${d.id}"
                                        th:text="${d.nombre + ' ' + d.apellido}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Docente Reemplazo</label>
                            <select class="form-select" th:field="*{docenteReemplazo.id}">
                                <option value="">Sin asignar</option>
                                <option th:each="d : ${docentes}" th:value="${d.id}"
                                        th:text="${d.nombre + ' ' + d.apellido}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Motivo</label>
                            <input type="text" class="form-control" th:field="*{motivo}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha Solicitud</label>
                            <input type="datetime-local" class="form-control" th:field="*{fechaHoraSolicitud}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha Respuesta</label>
                            <input type="datetime-local" class="form-control" th:field="*{fechaHoraRespuesta}"/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Estado</label>
                            <select class="form-select" th:field="*{estado}">
                                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-info text-white flex-grow-1"><i class="bi bi-save me-1"></i>Guardar</button>
                            <a href="/reasignaciones" class="btn btn-outline-secondary flex-grow-1"><i class="bi bi-x me-1"></i>Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
