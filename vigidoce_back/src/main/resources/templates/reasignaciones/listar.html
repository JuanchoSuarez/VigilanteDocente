<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reasignaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-arrow-left-right me-2 text-info"></i>Reasignaciones</h2>
        <a href="/reasignaciones/nuevo" class="btn btn-info text-white"><i class="bi bi-plus-lg me-1"></i>Nueva Reasignación</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Turno</th>
                    <th>Docente Original</th>
                    <th>Docente Reemplazo</th>
                    <th>Motivo</th>
                    <th>Solicitud</th>
                    <th>Respuesta</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${reasignaciones}">
                    <td th:text="${r.id}"></td>
                    <td th:text="${r.turno.id}"></td>
                    <td th:text="${r.docenteOriginal.nombre + ' ' + r.docenteOriginal.apellido}"></td>
                    <td th:text="${r.docenteReemplazo != null ? r.docenteReemplazo.nombre + ' ' + r.docenteReemplazo.apellido : 'Sin asignar'}"></td>
                    <td th:text="${r.motivo}"></td>
                    <td th:text="${r.fechaHoraSolicitud}"></td>
                    <td th:text="${r.fechaHoraRespuesta}"></td>
                    <td>
                                <span th:classappend="${r.estado.name() == 'PENDIENTE'} ? 'bg-warning text-dark' :
                                                      (${r.estado.name() == 'ACEPTADA'} ? 'bg-success' :
                                                      (${r.estado.name() == 'RECHAZADA'} ? 'bg-danger' : 'bg-secondary'))"
                                      class="badge" th:text="${r.estado}"></span>
                    </td>
                    <td>
                        <a th:href="@{/reasignaciones/editar/{id}(id=${r.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/reasignaciones/eliminar/{id}(id=${r.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
