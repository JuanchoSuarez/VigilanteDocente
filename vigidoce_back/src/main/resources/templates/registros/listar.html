<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registros de Vigilancia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-clipboard-check me-2 text-secondary"></i>Registros de Vigilancia</h2>
        <a href="/registros/nuevo" class="btn btn-secondary"><i class="bi bi-plus-lg me-1"></i>Nuevo Registro</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Turno</th>
                    <th>Docente</th>
                    <th>Zona</th>
                    <th>Check-In</th>
                    <th>Check-Out</th>
                    <th>Método</th>
                    <th>Recorrido</th>
                    <th>Limpieza</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="registro : ${registros}">
                    <td th:text="${registro.id}"></td>
                    <td th:text="${registro.turno.id}"></td>
                    <td th:text="${registro.docente.nombre + ' ' + registro.docente.apellido}"></td>
                    <td th:text="${registro.zona.nombre}"></td>
                    <td th:text="${registro.fechaHoraCheckIn}"></td>
                    <td th:text="${registro.fechaHoraCheckOut}"></td>
                    <td><span class="badge bg-secondary" th:text="${registro.metodoRegistro}"></span></td>
                    <td>
                        <span th:if="${registro.recorridoRealizado}" class="badge bg-success">Sí</span>
                        <span th:unless="${registro.recorridoRealizado}" class="badge bg-danger">No</span>
                    </td>
                    <td>
                                <span th:classappend="${registro.calificacionLimpieza == 1} ? 'bg-success' :
                                                      (${registro.calificacionLimpieza == 2} ? 'bg-warning text-dark' :
                                                      (${registro.calificacionLimpieza == 3} ? 'bg-orange text-dark' : 'bg-danger'))"
                                      class="badge" th:text="${registro.calificacionLimpieza}"></span>
                    </td>
                    <td>
                        <a th:href="@{/registros/editar/{id}(id=${registro.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/registros/eliminar/{id}(id=${registro.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
