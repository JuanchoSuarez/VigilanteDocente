<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Turno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header border-0 py-3" style="background: linear-gradient(135deg, #1e3a5f, #2e86de);">
                    <h5 class="text-white mb-0 fw-bold"><i class="bi bi-calendar-check me-2"></i>Formulario Turno</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/turnos/guardar}" th:object="${turno}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Docente</label>
                            <select class="form-select" th:field="*{docente.id}">
                                <option th:each="d : ${docentes}" th:value="${d.id}"
                                        th:text="${d.nombre + ' ' + d.apellido}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Zona</label>
                            <select class="form-select" th:field="*{zona.id}">
                                <option th:each="z : ${zonas}" th:value="${z.id}"
                                        th:text="${z.nombre}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Fecha</label>
                            <input type="date" class="form-control" th:field="*{fecha}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Hora Inicio</label>
                            <input type="time" class="form-control" th:field="*{horaInicio}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Hora Fin</label>
                            <input type="time" class="form-control" th:field="*{horaFin}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Estado</label>
                            <select class="form-select" th:field="*{estado}">
                                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Franja</label>
                            <select class="form-select" th:field="*{tipoFranja}">
                                <option th:each="f : ${franjas}" th:value="${f}" th:text="${f}"></option>
                            </select>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning text-white flex-grow-1"><i class="bi bi-save me-1"></i>Guardar</button>
                            <a href="/turnos" class="btn btn-outline-secondary flex-grow-1"><i class="bi bi-x me-1"></i>Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
