<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Turnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-calendar-check me-2 text-warning"></i>Turnos</h2>
        <a href="/turnos/nuevo" class="btn btn-warning text-white"><i class="bi bi-plus-lg me-1"></i>Nuevo Turno</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Docente</th>
                    <th>Zona</th>
                    <th>Fecha</th>
                    <th>Hora Inicio</th>
                    <th>Hora Fin</th>
                    <th>Estado</th>
                    <th>Franja</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="turno : ${turnos}">
                    <td th:text="${turno.id}"></td>
                    <td th:text="${turno.docente.nombre + ' ' + turno.docente.apellido}"></td>
                    <td th:text="${turno.zona.nombre}"></td>
                    <td th:text="${turno.fecha}"></td>
                    <td th:text="${turno.horaInicio}"></td>
                    <td th:text="${turno.horaFin}"></td>
                    <td>
                                <span th:classappend="${turno.estado.name() == 'PENDIENTE'} ? 'bg-warning text-dark' :
                                                      (${turno.estado.name() == 'EN_CURSO'} ? 'bg-success' :
                                                      (${turno.estado.name() == 'CERRADO'} ? 'bg-secondary' : 'bg-danger'))"
                                      class="badge" th:text="${turno.estado}"></span>
                    </td>
                    <td><span class="badge bg-info text-dark" th:text="${turno.tipoFranja}"></span></td>
                    <td>
                        <a th:href="@{/turnos/editar/{id}(id=${turno.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/turnos/eliminar/{id}(id=${turno.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
