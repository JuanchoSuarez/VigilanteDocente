<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Zona</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header border-0 py-3" style="background: linear-gradient(135deg, #1e3a5f, #2e86de);">
                    <h5 class="text-white mb-0 fw-bold"><i class="bi bi-geo-alt me-2"></i>Formulario Zona</h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/zonas/guardar}" th:object="${zona}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Descripción</label>
                            <input type="text" class="form-control" th:field="*{descripcion}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tipo</label>
                            <select class="form-select" th:field="*{tipo}">
                                <option th:each="tipo : ${tiposZona}" th:value="${tipo}" th:text="${tipo}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Capacidad Máxima</label>
                            <input type="number" class="form-control" th:field="*{capacidadMaxima}" required/>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" th:field="*{activa}"/>
                            <label class="form-check-label fw-semibold">Activa</label>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success flex-grow-1"><i class="bi bi-save me-1"></i>Guardar</button>
                            <a href="/zonas" class="btn btn-outline-secondary flex-grow-1"><i class="bi bi-x me-1"></i>Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
