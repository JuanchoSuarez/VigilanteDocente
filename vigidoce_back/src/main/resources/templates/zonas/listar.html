<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Zonas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>body { background-color: #f0f4f8; }</style>
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold"><i class="bi bi-geo-alt me-2 text-success"></i>Zonas</h2>
        <a href="/zonas/nuevo" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>Nueva Zona</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Tipo</th>
                    <th>Capacidad</th>
                    <th>Activa</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="zona : ${zonas}">
                    <td th:text="${zona.id}"></td>
                    <td th:text="${zona.nombre}"></td>
                    <td th:text="${zona.descripcion}"></td>
                    <td><span class="badge bg-success" th:text="${zona.tipo}"></span></td>
                    <td th:text="${zona.capacidadMaxima}"></td>
                    <td>
                        <span th:if="${zona.activa}" class="badge bg-success">Sí</span>
                        <span th:unless="${zona.activa}" class="badge bg-danger">No</span>
                    </td>
                    <td>
                        <a th:href="@{/zonas/editar/{id}(id=${zona.id})}" class="btn btn-sm btn-outline-warning me-1"><i class="bi bi-pencil"></i></a>
                        <a th:href="@{/zonas/eliminar/{id}(id=${zona.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar?')"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
