# ===== Config para tests de integración =====
# Usamos H2 en memoria: sin instalación, aislado, rápido.

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate recrea las tablas al iniciar cada test
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Desactiva el DataLoader automático durante los tests (cada test crea sus propios datos)
spring.main.lazy-initialization=false

# JWT (mismo secret y duración, no importa qué pongas mientras sea válido)
app.jwt.secret=TEST_SECRETO_PARA_TESTS_DE_INTEGRACION_VIGIDOCENTE_2026_MINIMO_32
app.jwt.expiration=86400000